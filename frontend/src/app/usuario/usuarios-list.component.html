
<div class="page-container">
  <!-- Contenedor principal de la página -->
  <!-- Mostrar mensaje de error si existe -->
  <div *ngIf="error" class="error" style="color: red;">
    {{ error }}
  </div>

  <!-- Título de la tabla de usuarios -->
  <div class="table-title">
    <h3>Lista Completa de Usuarios</h3>
  </div>

  <button (click)="accionTerminada()" class="btn btn-primary volver-btn">
  Volver al Dashboard
</button>


  <!-- Botón para crear nuevo usuario, solo visible si es administrador -->
  <div *ngIf="esAdmin()" class="create-user-button">
    <button (click)="irARegistrarUsuario()" class="btn btn-success">Crear Usuario</button>
  </div>

  <!-- Tabla con la lista de usuarios -->
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Rol</th> <!-- Columna para mostrar el rol del usuario -->
        <th>Acciones</th> <!-- Columna para botones de acción -->
      </tr>
    </thead>

    <tbody>
      <!-- Recorre la lista de usuarios para mostrar cada uno -->
      <tr *ngFor="let usuario of usuarios">
        <td>{{ usuario.nombre }}</td>       <!-- Nombre del usuario -->
        <td>{{ usuario.correo }}</td>       <!-- Correo del usuario -->
        <td>{{ usuario.rol }}</td>          <!-- Rol del usuario -->

        <td>
          <!-- Botón Editar, visible solo para admins -->
          <button *ngIf="esAdmin()" (click)="editarUsuario(usuario.id)" class="btn btn-sm btn-primary">
            Editar
          </button>

          <!-- Botón Eliminar, visible solo para admins -->
          <button *ngIf="esAdmin()" (click)="eliminarUsuario(usuario.id)" class="btn btn-sm btn-danger">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal para confirmar eliminación -->
  <div class="modal-backdrop" *ngIf="mostrarModalEliminar">
    <div class="modal">
      <h3>Confirmar Eliminación</h3>
      <p>¿Seguro que deseas eliminar este usuario?</p>
      <div class="modal-buttons">
        <button class="btn btn-danger" (click)="confirmarEliminar()">Sí, eliminar</button>
        <button class="btn btn-secondary" (click)="cancelarEliminar()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
