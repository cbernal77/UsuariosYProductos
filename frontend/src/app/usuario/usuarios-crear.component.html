<!-- usuarios-crear.component.html -->
<h2 class="register-title">Crear Nuevo Usuario</h2>

<!-- Formulario para crear el usuario -->
<form (ngSubmit)="crearUsuario()" class="register-form">
  <!-- Campo Nombre -->
  <div class="form-group">
    <label for="nombre" class="form-label">Nombre</label>
    <input
      type="text"
      id="nombre"
      [(ngModel)]="usuario.nombre"
      name="nombre"
      required
      class="form-control"
    />
  </div>

  <!-- Campo Correo -->
  <div class="form-group">
    <label for="correo" class="form-label">Correo</label>
    <input
      type="email"
      id="correo"
      [(ngModel)]="usuario.correo"
      name="correo"
      required
      class="form-control"
    />
  </div>
<!-- Campo para la contraseña del usuario -->
    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input
        type="password"
        id="contrasena"
        [(ngModel)]="usuario.contrasena"
        name="contrasena"
        class="form-control"
        placeholder="Ingrese la contraseña"
        required
      />
    </div>


  <!-- Campo Rol -->
  <div class="form-group">
    <label for="rol" class="form-label">Rol</label>
    <select
      id="rol"
      [(ngModel)]="usuario.rol"
      name="rol"
      required
      class="form-control"
    >
      <option value="cliente">Cliente</option>
      <option value="admin">Administrador</option>
    </select>
  </div>

  <!-- Mensaje de error -->
  <div *ngIf="error" class="error" style="color: red;">
    {{ error }}
  </div>

  <!-- Mensaje de éxito -->
  <div *ngIf="success" class="success" style="color: green;">
    {{ success }}
  </div>

  <!-- Botón para enviar el formulario -->
  <button type="submit" class="btn btn-submit" [disabled]="!usuario.nombre || !usuario.correo">
    Crear Usuario
  </button>
</form>
