  
<h2 class="edit-title">Editar Usuario</h2>

<!-- Mensaje de éxito -->
<div *ngIf="success" class="alert-success">
  {{ success }}
</div>

<!-- Mensaje de error -->
<div *ngIf="error" class="alert-danger">
  {{ error }}
</div>


<form (ngSubmit)="actualizarUsuario()" class="edit-form">
  
  
 
    <!-- Campo Nombre -->
  <div class="form-group">
    <label for="nombre">Nombre</label>
    <input
      type="text"
      id="nombre"
      [(ngModel)]="usuario.nombre"
      name="nombre"
      required
      class="form-control"
    />
  </div>

  <!-- Campo Correo -->
  <div class="form-group">
    <label for="correo">Correo</label>
    <input
      type="email"
      id="correo"
      [(ngModel)]="usuario.correo"
      name="correo"
      required
      class="form-control"
    />
  </div>

  <!-- Campo Rol -->
  <div class="form-group">
    <label for="rol">Rol</label>
    <select
      id="rol"
      [(ngModel)]="usuario.rol"
      name="rol"
      required
      class="form-control"
    >
      <option value="cliente">Cliente</option>
      <option value="admin">Administrador</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Guardar Cambios</button>
</form>
  
<!-- Modal Confirmación Guardar -->
<div class="modal-backdrop" *ngIf="mostrarModalGuardar">
  <div class="modal">
    <h3>Confirmar Guardar Cambios</h3>
    <p>¿Quieres guardar los cambios realizados en este usuario?</p>
    <div class="modal-buttons">
      <button class="btn btn-primary" (click)="confirmarGuardar()">Sí, guardar</button>
      <button class="btn btn-danger" (click)="cancelarGuardar()">Cancelar</button>
    </div>
  </div>
</div>
